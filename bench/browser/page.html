<!doctype html>
<meta charset="utf-8">
<title>keep-span-pii browser bench</title>
<script type="module">
  import * as ort from '/ort/ort.wasm.min.mjs';

  const q = new URLSearchParams(location.search);
  const model = q.get('model');
  const threads = Number(q.get('threads'));
  const lengths = q.get('lengths').split(',').map(Number);
  const runs = Number(q.get('runs'));
  const vocab = Number(q.get('vocab'));
  const result = { model, threads, isolated: self.crossOriginIsolated, lengths: [] };

  function ids(n) {
    // Fixed pseudo-random token ids (a linear congruential generator), with [CLS]-like and [SEP]-like ends.
    let s = 12345;
    const a = new BigInt64Array(n);
    for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) % 2147483648; a[i] = BigInt(1000 + (s % (vocab - 1000))); }
    a[0] = 1n; a[n - 1] = 2n;
    return a;
  }
  const median = (xs) => { const s = [...xs].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  const pct = (xs, p) => { const s = [...xs].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

  try {
    ort.env.wasm.numThreads = threads;
    ort.env.wasm.wasmPaths = '/ort/';
    const t0 = performance.now();
    const session = await ort.InferenceSession.create(`/model/${model}`, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    result.create_ms = performance.now() - t0;
    const names = session.inputNames;
    for (const n of lengths) {
      const feeds = { input_ids: new ort.Tensor('int64', ids(n), [1, n]) };
      if (names.includes('attention_mask')) feeds.attention_mask = new ort.Tensor('int64', new BigInt64Array(n).fill(1n), [1, n]);
      for (let i = 0; i < 5; i++) await session.run(feeds);
      const times = [];
      for (let i = 0; i < runs; i++) { const s = performance.now(); await session.run(feeds); times.push(performance.now() - s); }
      result.lengths.push({ length: n, median_ms: median(times), p90_ms: pct(times, 0.9), min_ms: Math.min(...times), times_ms: times });
    }
  } catch (e) {
    result.error = String(e);
  }
  window.__result = result;
  window.__done = true;
</script>
