[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepspan"
version = "0.1.0"
description = "Keep-span negatives for on-device PII span detection: data, training, int8 export and browser timing, on public data"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "transformers>=4.48,<5",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "faker>=30",
    "pyarrow>=14",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.20"]
paper = ["matplotlib>=3.8"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
keepspan-smoke = "keepspan.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["bench/browser/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
